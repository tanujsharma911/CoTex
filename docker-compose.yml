name: "CoTex"

services:
  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
      args:
        VITE_EDITOR_URL: ${VITE_EDITOR_URL}
        VITE_API_URL: ${VITE_API_URL}
    container_name: cotex-frontend
    ports:
      - "${VITE_FRONTEND_PORT}:80"

  # mongodb:
  #   image: mongo:6.0
  #   container_name: cotex-mongodb
  #   ports:
  #     - "${MONGODB_PORT}:27017"
  #   volumes:
  #     - mongodb_data:/data/db
  #   restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cotex-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: quay.io/minio/aistor/minio
    container_name: cotex-minio
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
      - ${HOME}/minio/minio.license:/minio.license
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: >
      server /data
      --console-address ":9001"
      --license /minio.license
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Initialize MinIO with a user and bucket
  minio-init:
    image: minio/mc
    container_name: cotex-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      (mc admin user add local ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} || true) &&
      mc admin policy attach local readwrite --user ${MINIO_ACCESS_KEY} &&
      mc mb --ignore-existing local/${MINIO_BUCKET}
      "
    restart: "no"

  # Load Balancer for API Service
  load-balancer:
    build:
      context: .
      dockerfile: services/load-balancer/Dockerfile
    container_name: cotex-lb
    ports:
      - "${LOAD_BALANCER_PORT}:80"
    depends_on:
      - api-service
      - editor-service
    restart: unless-stopped

  tex-compiler:
    build:
      context: .
      dockerfile: config/dockerfiles/Dockerfile.tex
    image: tex-compiler

  api-service:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS}
      API_PORT: ${API_PORT}
      TOKEN_SECRET: ${TOKEN_SECRET}
      TOKEN_EXPIRY: ${TOKEN_EXPIRY}
      MONGODB_URL: ${MONGODB_URL}
      MINIO_URL: ${MINIO_URL}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      - tex-compiler
      - redis
      # - mongodb
    restart: unless-stopped
    deploy:
      replicas: 1

  editor-service:
    build:
      context: .
      dockerfile: services/editor/Dockerfile
    environment:
      EDITOR_PORT: ${EDITOR_PORT}
      TOKEN_SECRET: ${TOKEN_SECRET}
      TOKEN_EXPIRY: ${TOKEN_EXPIRY}
      MONGODB_URL: ${MONGODB_URL}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      MINIO_URL: ${MINIO_URL}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    depends_on:
      - redis
      # - mongodb
    restart: unless-stopped
    deploy:
      replicas: 2

volumes:
  redis_data:
  # mongodb_data:
  minio_data: